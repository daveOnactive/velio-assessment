services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: velio
      POSTGRES_USER: velio
      POSTGRES_PASSWORD: velio
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data", "./backend/sql:/docker-entrypoint-initdb.d:ro"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  postgres_data:
